<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Anurag Patel Blue and Green Profile Banner">
  <defs>
    <linearGradient id="oceanBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06101c"/>
      <stop offset="50%" stop-color="#0a1e2e"/>
      <stop offset="100%" stop-color="#061a19"/>
    </linearGradient>
    <linearGradient id="bgGradBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="titleCool" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="55%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="auroraRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.24"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.20"/>
    </linearGradient>
    <clipPath id="bannerClip">
      <rect x="2" y="2" width="896" height="216" rx="20"/>
    </clipPath>
    <style>
      @keyframes floatSubtle { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-3px); } }
      @keyframes pulseDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      .floatInner1 { animation: floatSubtle 4.8s ease-in-out infinite; }
      .floatInner2 { animation: floatSubtle 5.6s ease-in-out infinite 0.7s; }
      .pulseGreen { animation: pulseDot 2s ease-in-out infinite; }
    </style>
  </defs>

  <g clip-path="url(#bannerClip)">
    <rect x="2" y="2" width="896" height="216" rx="20" fill="url(#oceanBg)"/>
    <!-- Flowing aurora curves -->
    <path d="M -40 165 C 180 70, 410 235, 650 115 C 770 55, 860 95, 940 42 L 940 235 L -40 235 Z" fill="url(#auroraRibbon)"/>
    <path d="M -40 192 C 210 120, 440 245, 720 142 C 810 108, 880 122, 940 92" fill="none" stroke="url(#bgGradBorder)" stroke-width="1.5" stroke-opacity="0.45"/>
    <circle cx="810" cy="48" r="95" fill="#10b981" fill-opacity="0.10"/>
    <circle cx="135" cy="188" r="115" fill="#0ea5e9" fill-opacity="0.11"/>
  </g>
  <rect x="2" y="2" width="896" height="216" rx="20" fill="none" stroke="url(#bgGradBorder)" stroke-width="1.5"/>

  <!-- Left Editorial Header (contained strictly within x=42..555) -->
  <rect x="42" y="28" width="234" height="24" rx="5" fill="#0a2030" stroke="#0ea5e9" stroke-opacity="0.5" stroke-width="1"/>
  <text x="159" y="44" text-anchor="middle" fill="#38bdf8" font-family="Consolas, 'Fira Code', monospace" font-size="10.5" font-weight="700" letter-spacing="1.4">FOLIO // @ANURAG200513</text>

  <text x="42" y="106" fill="url(#titleCool)" font-family="Georgia, 'Segoe UI', serif" font-size="45" font-weight="700" letter-spacing="-0.6">Anurag Patel</text>
  <text x="44" y="138" fill="#e0f2fe" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="15" font-weight="600">3rd Year CSE Student  •  Hackathon &amp; Full-Stack Builder</text>
  <text x="44" y="162" fill="#94a3b8" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="13">Crafting geospatial AI prototypes, clean web UIs &amp; collaborative OSS.</text>

  <rect x="44" y="184" width="54" height="3.5" rx="2" fill="url(#bgGradBorder)"/>
  <text x="108" y="189" fill="#34d399" font-family="Consolas, monospace" font-size="11.5" font-weight="700">HACKATHON SANDBOX  |  BLUE &amp; EMERALD</text>

  <!-- Right Stacked Cards (strictly within x=582..868, zero overlap!) -->
  <g transform="translate(582, 22)">
    <g class="floatInner1">
      <rect x="0" y="0" width="284" height="82" rx="12" fill="#091a28" fill-opacity="0.94" stroke="#0ea5e9" stroke-opacity="0.5" stroke-width="1.2"/>
      <text x="16" y="23" fill="#38bdf8" font-family="Consolas, monospace" font-size="10.5" font-weight="700">// CURRENT FOCUS</text>
      <rect x="192" y="10" width="76" height="18" rx="4" fill="#0d2a3d" stroke="#0ea5e9" stroke-opacity="0.35"/>
      <text x="230" y="23" text-anchor="middle" fill="#7dd3fc" font-family="Consolas, monospace" font-size="9.5" font-weight="700">PYTHON API</text>
      <text x="16" y="46" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700">ORE FINDER-AI</text>
      <text x="16" y="66" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11.5">Subsurface Voxel &amp; Space ML Platform</text>
    </g>
  </g>

  <g transform="translate(582, 114)">
    <g class="floatInner2">
      <rect x="0" y="0" width="284" height="84" rx="12" fill="#07191c" fill-opacity="0.96" stroke="#10b981" stroke-opacity="0.6" stroke-width="1.2"/>
      <circle class="pulseGreen" cx="18" cy="20" r="4" fill="#34d399"/>
      <text x="29" y="24" fill="#6ee7b7" font-family="Consolas, monospace" font-size="10.5" font-weight="700">ACHIEVEMENTS UNLOCKED</text>
      <rect x="14" y="34" width="124" height="22" rx="5" fill="#0c262b" stroke="#10b981" stroke-opacity="0.45"/>
      <text x="76" y="49" text-anchor="middle" fill="#d1fae5" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">🧠 Galaxy Brain x4</text>
      <rect x="146" y="34" width="124" height="22" rx="5" fill="#0d2538" stroke="#38bdf8" stroke-opacity="0.45"/>
      <text x="208" y="49" text-anchor="middle" fill="#e0f2fe" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">🦈 Pull Shark x2</text>
      <text x="16" y="73" fill="#94a3b8" font-family="Consolas, monospace" font-size="10">19+ PRs  •  32+ Answers  •  YOLO &amp; Quickdraw</text>
    </g>
  </g>
</svg>