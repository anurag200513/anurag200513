name: Refresh Profile Radar Telemetry

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update radar-telemetry.svg
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_USER: ${{ github.repository_owner }}
        run: python .github/scripts/update_stats.py
      - name: Commit updated SVG if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/radar-telemetry.svg
          git diff --cached --quiet || (git commit -m "chore: refresh radar telemetry" && git push)
